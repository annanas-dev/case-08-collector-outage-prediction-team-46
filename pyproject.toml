[project]
name = "annanas"
version = "0.1.0"
description = "Хакатон ДЖКХ: анализ журнала событий диспетчерской системы"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas<3",
    "pyarrow>=25.0.1",
    "pyspark>=4.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "jupytext>=1.19.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: долгие тесты на реальных данных из datasets/processed; запуск – make test-slow"]
addopts = "-m 'not slow'"
